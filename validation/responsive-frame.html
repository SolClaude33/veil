<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEIL responsive review</title><style>body{margin:0;padding:20px;background:#e8e9e5;color:#26304a;font:14px Arial,sans-serif;min-height:1100px}label{display:inline-flex;align-items:center;margin:0 20px 16px 0}select{font:inherit;margin-left:8px;padding:6px}iframe{display:block;width:390px;height:844px;border:0;background:#f5f3ed;box-shadow:0 0 0 1px #bbbfc8}</style></head>
<body><label>Review width <select id="review-width"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select></label><label>Review height <select id="review-height"><option value="620">620 px</option><option value="720">720 px</option><option value="844" selected>844 px</option><option value="1024">1024 px</option></select></label><iframe id="preview" title="VEIL responsive preview" src="/"></iframe><script>document.getElementById('review-width').addEventListener('change',event=>{document.getElementById('preview').style.width=event.target.value+'px';});document.getElementById('review-height').addEventListener('change',event=>{document.getElementById('preview').style.height=event.target.value+'px';});</script></body>
</html>
