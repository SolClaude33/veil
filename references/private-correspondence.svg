<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200">
  <rect width="1440" height="1200" fill="#f5f3ed"/>
  <g fill="#283f83" font-family="Georgia,serif">
    <text x="64" y="65" font-size="42">veil</text>
    <text x="720" y="210" text-anchor="middle" font-size="92">For the thoughts</text>
    <text x="720" y="302" text-anchor="middle" font-size="98" font-style="italic">you keep to yourself.</text>
  </g>
  <g font-family="Arial,sans-serif" fill="#697187" text-anchor="middle"><text x="720" y="125" font-size="12" letter-spacing="3">A PRIVATE STUDIO FOR AN OPEN MIND</text><text x="720" y="351" font-size="18">A quieter kind of AI. More room to think, less to put on show.</text></g>
  <rect x="594" y="384" width="252" height="54" rx="27" fill="#283f83"/><text x="720" y="417" fill="white" text-anchor="middle" font-family="Arial" font-size="15">Open your private studio ↗</text>
  <g transform="translate(440 518) rotate(-5 280 100)"><rect width="560" height="256" rx="4" fill="#e8e5da"/><path d="M0 0 280 168 560 0" fill="#dcd8ca"/><rect x="98" y="-20" width="364" height="223" rx="2" fill="#ccd5e7" transform="rotate(7 280 100)"/><text x="150" y="42" fill="#283f83" font-family="Georgia" font-style="italic" font-size="37">What if…</text><path d="M0 0 285 160 560 0V256H0Z" fill="#fdfbf5"/><path d="M0 256 280 105 560 256" fill="#eeeadd"/><circle cx="280" cy="164" r="33" fill="#283f83"/><text x="280" y="178" fill="#fffefa" font-family="Georgia" text-anchor="middle" font-size="36" font-style="italic">v</text></g>
  <text x="270" y="610" fill="#697187" font-family="Georgia" font-size="25" font-style="italic">An idea,</text><text x="270" y="640" fill="#697187" font-family="Georgia" font-size="25" font-style="italic">still unfolding.</text>
  <rect y="865" width="1440" height="335" fill="#283f83"/><g fill="#f5f3ed" font-family="Georgia" text-anchor="middle"><text x="720" y="972" font-size="65">Not every thought</text><text x="720" y="1048" font-size="69" font-style="italic">needs an audience.</text></g>
</svg>
